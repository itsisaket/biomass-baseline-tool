<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายงานผล</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light" style="font-family: 'Sarabun', sans-serif;">

  <div class="container mt-4 mb-5" style="max-width: 800px;">
    <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded shadow-sm border-start border-5 border-info">
      <div><h5 class="mb-0 text-info fw-bold">📊 รายงานผลสรุป (Dashboard)</h5><small class="text-muted">ผู้ใช้งาน: <span id="displayUser"></span></small></div>
      <a href="index.html" class="btn btn-outline-secondary btn-sm">🏠 หน้าหลัก</a>
    </div>

    <h6 class="fw-bold text-secondary mb-3">🌍 ภาพรวมโครงการทั้งหมด</h6>
    <div class="row mb-4">
      <div class="col-6"><div class="card shadow-sm border-0 bg-primary text-white text-center p-3"><h2 class="mb-0 fw-bold" id="g_farmers">...</h2><small>ครัวเรือนที่เข้าร่วม</small></div></div>
      <div class="col-6"><div class="card shadow-sm border-0 bg-success text-white text-center p-3"><h2 class="mb-0 fw-bold" id="g_area">...</h2><small>พื้นที่รวม (ไร่)</small></div></div>
    </div>

    <h6 class="fw-bold text-secondary mb-3 mt-5">👤 สรุปผลส่วนบุคคล (เดือนล่าสุด)</h6>
    <div class="row mb-4">
      <div class="col-6"><div class="card shadow-sm border-0 border-start border-4 border-warning p-3"><small class="text-muted">มูลค่าน้ำส้มควันไม้</small><h4 class="mb-0 text-warning fw-bold"><span id="p_wood">0</span> ฿</h4></div></div>
      <div class="col-6"><div class="card shadow-sm border-0 border-start border-4 border-dark p-3"><small class="text-muted">มูลค่าถ่านไบโอชาร์</small><h4 class="mb-0 text-dark fw-bold"><span id="p_biochar">0</span> ฿</h4></div></div>
    </div>

    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body">
        <h6 class="text-center fw-bold mb-3">เปรียบเทียบต้นทุนรวม (ก่อนใช้ vs หลังใช้เตา)</h6>
        <canvas id="costChart" height="200"></canvas>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbznwTBduitkVB41HjVgZH1f5JKFsPcpwqO9_uoqF-beG8TAvU3ZfzAgdjQUyJtue0CBQQ/exec"; 
    let myChart = null;

    window.onload = async function() {
      const phone = localStorage.getItem("loggedPhone");
      if (!phone) window.location.href = "index.html";
      else {
        document.getElementById("displayUser").innerText = localStorage.getItem("loggedName");
        await loadDashboardData(phone);
      }
    };

    async function loadDashboardData(phone) {
      try {
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "dashboard", phone: phone }) }).then(r => r.json());
        if (res.success) {
          document.getElementById("g_farmers").innerText = res.global.totalFarmers;
          document.getElementById("g_area").innerText = res.global.totalArea.toLocaleString();
          document.getElementById("p_wood").innerText = res.personal.myWoodVinegarVal.toLocaleString();
          document.getElementById("p_biochar").innerText = res.personal.myBiocharVal.toLocaleString();
          renderChart(res.personal.myBaselineCost, res.personal.myCurrentCost);
        }
      } catch (error) { console.error(error); }
    }

    function renderChart(baseCost, currCost) {
      const ctx = document.getElementById('costChart').getContext('2d');
      if (myChart) myChart.destroy();
      myChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['ต้นทุนฐาน', 'ต้นทุนปัจจุบัน'],
          datasets: [{ data: [baseCost, currCost], backgroundColor: ['#dc3545', '#28a745'], borderRadius: 5 }]
        },
        options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
      });
    }
  </script>
</body>
</html>
