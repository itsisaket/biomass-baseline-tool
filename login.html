<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - โครงการเตาชีวมวลไร้ควัน</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100" style="font-family: 'Sarabun', sans-serif;">

  <div class="container-fluid d-flex flex-column justify-content-center align-items-center flex-grow-1 px-3">
    <div class="w-100" style="max-width: 450px;">
      
      <div class="mb-3 text-start">
        <a href="index.html" class="text-decoration-none text-secondary">← กลับหน้าหลัก</a>
      </div>

      <div class="text-center mb-4">
        <h3 class="text-success fw-bold">โครงการวิจัยเตาชีวมวลไร้ควัน</h3>
      </div>

      <div class="card shadow-lg border-0 border-top border-5 border-success rounded-4">
        <div class="card-body p-4 p-md-5 text-center">
          <h5 class="mb-4 text-secondary" id="authTitle">เข้าสู่ระบบเพื่อจัดการข้อมูล</h5>
          
          <input type="text" id="reg_name" class="form-control form-control-lg mb-3" placeholder="ชื่อ-นามสกุล" style="display:none;">
          <input type="text" id="username" class="form-control form-control-lg mb-3" placeholder="เบอร์โทรศัพท์ (10 หลัก)" maxlength="10" inputmode="numeric">
          <input type="password" id="password" class="form-control form-control-lg mb-4" placeholder="รหัสผ่าน">
          
          <button id="btnLogin" class="btn btn-success btn-lg w-100 mb-2 fw-bold" onclick="executeAuth('login')">เข้าสู่ระบบ</button>
          <button id="btnRegister" class="btn btn-primary btn-lg w-100 mb-2 fw-bold" onclick="executeAuth('register')" style="display:none;">ยืนยันการสมัคร</button>
          
          <a href="#" class="text-decoration-none mt-3 d-block text-secondary" id="switchAuth" onclick="toggleAuthMode()">ยังไม่มีบัญชี? สมัครสมาชิกที่นี่</a>
        </div>
      </div>
      
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzZVOZtGsfF3TOWUM7XvRzfdQDEzj8NphrmqKL1LjxMgO1zNaw64Uwc3ZiXKO301gt5dQ/exec";
    let isLoginMode = true;

    window.onload = function() {
      if (localStorage.getItem("loggedPhone")) window.location.href = "index.html";
    };

    function toggleAuthMode() {
      isLoginMode = !isLoginMode;
      document.getElementById('authTitle').innerText = isLoginMode ? "เข้าสู่ระบบเพื่อจัดการข้อมูล" : "สมัครสมาชิกใหม่";
      document.getElementById('btnLogin').style.display = isLoginMode ? "block" : "none";
      document.getElementById('btnRegister').style.display = isLoginMode ? "none" : "block";
      document.getElementById('reg_name').style.display = isLoginMode ? "none" : "block";
      document.getElementById('switchAuth').innerText = isLoginMode ? "ยังไม่มีบัญชี? สมัครสมาชิกที่นี่" : "มีบัญชีอยู่แล้ว? เข้าสู่ระบบ";
    }

    async function executeAuth(action) {
      const user = document.getElementById("username").value, pass = document.getElementById("password").value, name = document.getElementById("reg_name").value;
      if(!user || !pass) return alert("กรุณากรอกข้อมูลให้ครบ");
      const btn = document.getElementById(action === 'login' ? 'btnLogin' : 'btnRegister');
      btn.innerText = "กำลังประมวลผล..."; btn.disabled = true;

      try {
        const res = await fetch(API_URL, { 
          method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: action, username: user, password: pass, name: name }) 
        }).then(r => r.json());

        if(res.success && action === 'login') {
          localStorage.setItem("loggedName", res.name); localStorage.setItem("loggedPhone", user); localStorage.setItem("loggedRole", res.role);
          window.location.href = "index.html"; 
        } else if (res.success && action === 'register') { 
          alert("สมัครสำเร็จ! กรุณาเข้าสู่ระบบ"); toggleAuthMode(); 
        } else { alert(res.message); }
      } catch (e) { alert("การเชื่อมต่อขัดข้อง: " + e.message); }
      btn.innerText = action === 'login' ? "เข้าสู่ระบบ" : "ยืนยันการสมัคร"; btn.disabled = false;
    }
  </script>
</body>
</html>
